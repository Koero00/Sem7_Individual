apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-results
spec:
  scaleTargetRef:
    name: order-result-consumer
  pollingInterval: 5
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 4
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        vhostName: /webshop
        queueName: orders.inventory-results.v1
        mode: QueueLength
        value: "20"
        activationValue: "0"
        excludeUnacknowledged: "false"
      authenticationRef:
        name: inventory-rabbitmq
