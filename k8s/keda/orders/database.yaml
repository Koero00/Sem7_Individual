apiVersion: v1
kind: Service
metadata:
  name: order-database
spec:
  selector:
    app: order-database
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-database
spec:
  serviceName: order-database
  replicas: 1
  selector:
    matchLabels:
      app: order-database
  template:
    metadata:
      labels:
        app: order-database
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: orders
            - name: POSTGRES_DB
              value: orders
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: experiment-credentials
                  key: order-postgres-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            exec:
              command: [pg_isready, -U, orders, -d, orders]
            periodSeconds: 5
          startupProbe:
            exec:
              command: [pg_isready, -U, orders, -d, orders]
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
