apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-reservation-consumer
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inventory-reservation-consumer
  template:
    metadata:
      labels:
        app: inventory-reservation-consumer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: cloudproject-inventory:keda
          imagePullPolicy: Never
          command: [python, reservation_consumer.py]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: experiment-credentials
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: experiment-credentials
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
