apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-keda-setup
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: setup
          image: cloudproject-inventory:keda
          imagePullPolicy: Never
          command: [python, /experiment/reservation_backlog.py, setup]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: experiment-credentials
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: experiment-credentials
                  key: RABBITMQ_URL
            - name: PYTHONPATH
              value: /app
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: experiment
              mountPath: /experiment
              readOnly: true
      volumes:
        - name: experiment
          configMap:
            name: reservation-backlog-script
