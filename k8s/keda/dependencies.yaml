apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: experiment-credentials
                  key: rabbitmq-username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: experiment-credentials
                  key: rabbitmq-password
            - name: RABBITMQ_DEFAULT_VHOST
              value: /webshop
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 10
            timeoutSeconds: 10
          startupProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 36
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-database
spec:
  selector:
    app: inventory-database
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory-database
spec:
  serviceName: inventory-database
  replicas: 1
  selector:
    matchLabels:
      app: inventory-database
  template:
    metadata:
      labels:
        app: inventory-database
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: inventory
            - name: POSTGRES_DB
              value: inventory
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: experiment-credentials
                  key: postgres-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            exec:
              command: [pg_isready, -U, inventory, -d, inventory]
            periodSeconds: 5
          startupProbe:
            exec:
              command: [pg_isready, -U, inventory, -d, inventory]
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
