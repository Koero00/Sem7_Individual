apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-loadtest
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:1.8.2
          args: ["run", "/scripts/catalog.js"]
          env:
            - name: BASE_URL
              value: "http://catalog:8000"
            - name: CATALOG_PATH
              value: "/"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: k6-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: k6-script
          configMap:
            name: catalog-load-script
