apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: cloudproject-catalog:exp1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: catalog-db-credentials
                key: DATABASE_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"